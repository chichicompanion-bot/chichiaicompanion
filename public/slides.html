Mean Squares):</b> Khi người đeo cử động tay, sóng PPG bị nhiễu nặng. STROKEGUARD dùng vector gia tốc 3 trục làm tham chiếu để <b>triệt tiêu 80% nhiễu cử động</b>: <code>e(n) = d(n) - Wᵀ(n)x(n)</code>.", "<b>2. Sàng lọc sớm Rung nhĩ (AFib) qua biến thiên HRV:</b> Trích xuất liên tục khoảng R-R Interval (IBI). Tính toán chỉ số SDNN và RMSSD. Khi <b>RMSSD &gt; 75ms</b> kèm nhịp loạn hỗn loạn → Cảnh báo sớm nguy cơ huyết khối đột quỵ!", "<b>3. Trích xuất tần số hô hấp (RPM) qua sóng PPG (RIIV):</b> Lọc dải thông 0.1Hz – 0.5Hz để đo nhịp thở (6–30 lần/phút) không cần đeo đai ngực, phát hiện sớm suy hô hấp cấp."], "right_img": "/slide_assets/illust_07_lms_filter.png"}, {"num": 10, "tag": "3. CÔNG NGHỆ • THUẬT TOÁN TÉ NGÃ & SƠ ĐỒ HỆ THỐNG", "title": "MÔ HÌNH NHẬN DIỆN TÉ NGÃ 4 GIAI ĐOẠN & KIẾN TRÚC PHẦN CỨNG 3 KHỐI", "subtitle": "Loại bỏ 95% báo động giả trong sinh hoạt thường ngày (vung tay, ngồi mạnh, đập bàn)", "layout": "two_imgs", "left_img": "/slide_assets/illust_08_fall_4stages.png", "right_img": "/slide_assets/image4.png", "bottom_note": "<b>Đa luồng FreeRTOS & Power Duty Cycling:</b> Độ trễ phát cảnh báo khẩn cấp <b>&lt; 1.5 giây</b>. Bình thường chỉ tiêu thụ 38mA (GPS ngủ), chỉ bật GPS (110mA) khi có biến cố → Pin 400mAh hoạt động liên tục <b>21,5 giờ</b>."}, {"num": 11, "tag": "4. SẢN PHẨM & HỆ SINH THÁI PHẦN MỀM", "title": "SẢN PHẨM THỰC TẾ: VÒNG TAY STROKEGUARD & WEB DASHBOARD 3D", "subtitle": "Hệ thống đã hoàn thiện từ mạch phần cứng đến nền tảng Web trực tuyến tại chichiaicompanion.com", "layout": "split", "left_header": "BỘ ĐÔI SẢN PHẨM HOÀN CHỈNH (HARDWARE + 3D WEB)", "left_color": "teal", "bullets": ["<b>1. Vòng đeo tay phần cứng STROKEGUARD (45 × 38 × 14 mm):</b> Cụm cảm biến quang học PPG & nhiệt độ áp sát da; cảm biến chuyển động 6 trục + GPS vệ tinh; Còi Buzzer tại chỗ + Nút bấm SOS & Nút hủy báo động nhầm; Sạc USB Type-C.", "<b>2. Nền tảng Web Dashboard (chichiaicompanion.com):</b>", "• Giao diện <b>Nền Đen (Dark Mode)</b> y sinh hiện đại trên cả máy tính & điện thoại.", "• Mô hình <b>Cơ thể & Quả tim 3D chân thực</b> co bóp theo đúng nhịp tim người đeo.", "• <b>Bản đồ GPS với Chấm Xanh Lá</b> đứng yên hoặc di chuyển theo bước chân thực tế.", "• <b>Biển báo động đỏ đột quỵ</b> bật giữa màn hình ngay khi chỉ số vượt ngưỡng!"], "right_img": "/slide_assets/desktop_body_verified.png"}, {"num": 12, "tag": "4. SẢN PHẨM & KIỂM CHỨNG PHẢN HỒI KHÁCH HÀNG", "title": "KẾT QUẢ THỰC NGHIỆM TRÊN 15 NGƯỜI & PHẢN HỒI NGƯỜI DÙNG THỬ", "subtitle": "Đo kiểm đối chứng 1.000 mẫu PPG với máy y tế chuyên dụng FS20D & mô phỏng 5 kịch bản sinh hoạt", "layout": "table", "headers": ["Giả thuyết / Hạng mục kiểm thử", "Phương pháp thử nghiệm", "Kết quả đạt được", "Đánh giá"], "rows": [["1. Khử nhiễu LMS & Đo Nhịp tim (HR)", "Đo trên 15 người (ngồi tĩnh & đi bộ vung tay)", "Khử 80% nhiễu; Sai số ±2.1 BPM (2.6%)", "ĐẠT (Cao)"], ["2. Đo nồng độ Oxy máu (SpO2)", "Đối chứng trực tiếp với máy đo y tế FS20D", "Sai số chỉ ±1.8% (dải đo 90% - 100%)", "ĐẠT (Cao)"], ["3. Sàng lọc Rung nhĩ (AFib) qua HRV", "Kiểm thử ngưỡng RMSSD > 75ms & Poincaré", "Nhận diện đúng chuỗi nhịp loạn kịch phát", "ĐẠT"], ["4. Mô hình nhận diện té ngã 4 giai đoạn", "3 tư thế ngã + 5 hành vi giả (ngồi mạnh, vung tay)", "Độ nhạy 94.9% | Độ đặc hiệu 95.0%", "VƯỢT MỤC TIÊU"], ["5. Thời lượng Pin & Độ trễ cảnh báo SOS", "Pin Li-Po 400mAh (Power Duty Cycling)", "Hoạt động 21,5 giờ | Độ trễ SOS < 1.5 giây", "ĐẠT"]], "bottom_note": "<b>Phản hồi khách hàng thử nghiệm:</b> 93,3% người cao tuổi hài lòng vì vòng tay nhẹ, tự động, có nút hủy báo nhầm trong 10s; 100% con cái ấn tượng với mô hình Cơ thể 3D & Chấm xanh GPS thời gian thực."}, {"num": 13, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 1)", "title": "CÂU HỎI 1: TẠI SAO KHÁCH HÀNG CẦN SẢN PHẨM NÀY?", "subtitle": "Nhu cầu ấy là \"BẮT BUỘC PHẢI CÓ\", \"CẦN PHẢI CÓ\" hay đơn giản chỉ là \"SẢN PHẨM THAY THẾ\"?", "layout": "split", "left_header": "TRẢ LỜI TRỌNG TÂM: ĐÂY LÀ SẢN PHẨM \"BẮT BUỘC PHẢI CÓ\" (MUST-HAVE)", "left_color": "red", "bullets": ["<b>1. Không phải Vitamin, mà là Thuốc Cứu Mạng (Painkiller):</b> Với gia đình có người cao tuổi mắc bệnh cao huyết áp, tim mạch hoặc từng tai biến nhẹ, nguy cơ đột quỵ và té ngã ban đêm là mối đe dọa sinh tử hiện hữu mỗi ngày.", "<b>2. Tại sao máy đo huyết áp truyền thống KHÔNG thể thay thế?</b> Máy đo huyết áp bắp tay hay máy kẹp SpO₂ ngón tay chỉ đo được khi người bệnh <b>CÒN TỈNH TÁO</b> và chủ động ngồi đo. Nhưng khi đột quỵ ập đến lúc 2 giờ sáng hoặc ngất trong nhà tắm, bệnh nhân mất hoàn toàn khả năng tự gọi cứu hộ!", "<b>3. Giá trị của 'Giờ Vàng' (3 – 4.5 giờ đầu):</b> Đưa bệnh nhân đến viện trong Giờ Vàng giúp phục hồi tới 90%. Trễ Giờ Vàng đồng nghĩa với liệt giường suốt đời (chi phí 100 – 300 triệu VNĐ) hoặc tử vong."], "right_img": "/slide_assets/illust_09_why_need.png"}, {"num": 14, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 2)", "title": "CÂU HỎI 2: TẠI SAO KHÁCH HÀNG LẠI PHẢI MUA SẢN PHẨM ẤY TỪ BẠN?", "subtitle": "4 lợi thế độc quyền giúp STROKEGUARD vượt trội hoàn toàn so với Smartwatch thương mại ngoại nhập", "layout": "split_left_img", "left_img": "/slide_assets/illust_10_why_us_4pillars.png", "right_header": "4 LÝ DO KHÁCH HÀNG CHỌN STROKEGUARD - BAND", "right_color": "teal", "bullets": ["<b>1. Giám sát Rung nhĩ & Đột quỵ THỤ ĐỘNG 24/7:</b> Apple Watch đòi hỏi người dùng phải chủ động đặt ngón tay lên núm xoay Digital Crown trong 30 giây mới đo được ECG. Ngược lại, STROKEGUARD tự động quét HRV (RMSSD) & SpO₂ liên tục ngay cả khi ông bà đang ngủ say!", "<b>2. Tích hợp đồng thời 4-trong-1 chuyên biệt cho người già:</b> Kết hợp (1) Sàng lọc AFib + (2) Nhận diện té ngã 4 bước + (3) Còi Buzzer hú tại chỗ + (4) Định vị GPS thời gian thực.", "<b>3. Thiết kế Việt hóa 100% — Không rào cản công nghệ:</b> Người cao tuổi chỉ cần đeo vào tay; con cháu mở link Web 3D là thấy ngay nhịp đập trái tim & chấm xanh GPS.", "<b>4. Bảo hành & Tùy biến ngưỡng sinh lý tại địa phương:</b> Hỗ trợ hiệu chỉnh ngưỡng nhịp tim cá nhân hóa ngay tại Đà Nẵng & Việt Nam."]}, {"num": 15, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 3)", "title": "CÂU HỎI 3: TẠI SAO KHÁCH HÀNG LẠI PHẢI MUA SẢN PHẨM ẤY NGAY BÂY GIỜ?", "subtitle": "Tính cấp bách về thời điểm y tế, xã hội và kinh tế khiến khách hàng không thể chần chừ", "layout": "split", "left_header": "3 ĐỘNG LỰC KHIẾN KHÁCH HÀNG PHẢI HÀNH ĐỘNG NGAY HÔM NAY", "left_color": "red", "bullets": ["<b>1. Đột quỵ không bao giờ báo trước ngày giờ:</b> Các cơn Rung nhĩ kịch phát và tai biến mạch máu não thường xảy ra đột ngột vào ban đêm hoặc khi thời tiết chuyển mùa. Chờ đến khi có triệu chứng rõ rệt thì đã quá muộn!", "<b>2. Xu hướng gia đình hạt nhân & Bố mẹ già ở một mình:</b> Tại các đô thị như Đà Nẵng, con cái đi làm từ 7h sáng đến 6h tối. Ông bà ở nhà một mình 8 – 12 tiếng mỗi ngày mà không có thiết bị bảo vệ tự động.", "<b>3. Bài toán chi phí: 890.000đ hôm nay vs. 200.000.000đ ngày mai:</b> Mua STROKEGUARD ngay hôm nay chỉ tốn 890.000 VNĐ (chưa bằng 1% chi phí phẫu thuật và điều trị nội trú khi phát hiện đột quỵ muộn).", "<b>4. Chính sách Đeo thử 7 ngày & Bảo hành đổi mới:</b> Khách hàng không chịu bất kỳ rủi ro nào khi trang bị ngay cho cha mẹ."], "right_img": "/slide_assets/illust_11_why_now_clock.png"}, {"num": 16, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 4)", "title": "CÂU HỎI 4: TẠI SAO KHÁCH HÀNG CHẤP NHẬN MUA VỚI GIÁ 890.000 VNĐ?", "subtitle": "Phân tích tâm lý định giá (Pricing Psychology) và giá trị vượt trội trên từng đồng chi phí", "layout": "split_left_img", "left_img": "/slide_assets/illust_12_why_price.png", "right_header": "TẠI SAO 890.000 VNĐ LÀ \"MỨC GIÁ VÀNG\" (SWEET SPOT)?", "right_color": "teal", "bullets": ["<b>1. Rẻ hơn 10 – 13 lần so với Smartwatch ngoại nhập:</b> Apple Watch Series có giá từ 11.499.000đ, vòng đeo WHOOP tốn 9.220.000đ/năm tiền thuê bao. Với <b>890.000đ</b>, STROKEGUARD phá vỡ hoàn toàn rào cản tài chính.", "<b>2. Nằm trong ngưỡng 'Chi tiêu báo hiếu không cần đắn đo':</b> 890. ã 4 giai đoạn + Định vị GPS thời gian thực trên Web 3D."}, {"num": 18, "tag": "5. CHIẾN LƯỢC PHÁT TRIỂN THỊ TRƯỜNG: SALES & MARKETING", "title": "CHIẾN LƯỢC THÂM NHẬP THỊ TRƯỜNG (GO-TO-MARKET) ĐA KÊNH", "subtitle": "Kết hợp truyền thông cảm xúc 'Báo Hiếu & Giờ Vàng' với mạng lưới Phòng khám Tim mạch & Nhà thuốc", "layout": "split_left_img", "left_img": "/slide_assets/illust_13_gtm_marketing.png", "right_header": "PHỄU BÁN HÀNG & CHIẾN THUẬT CHUYỂN ĐỔI CAO", "right_color": "teal", "bullets": ["<b>1. Chiến dịch Marketing chạm cảm xúc (Awareness):</b> Chuỗi video ngắn 30s <i>'Đừng Để Giờ Vàng Trôi Qua Trong Đêm'</i> trên TikTok, Facebook Reels & Zalo Video nhắm tới tệp con cái 28–50 tuổi. Định vị là 'Món quà Báo Hiếu thiết thực nhất' dịp Lễ Vu Lan, Tết, Ngày Người cao tuổi.", "<b>2. Chiến thuật 'Đeo Thử 7 Ngày Tại Phòng Khám' (Activation):</b> Đặt quầy trưng bày tại các Phòng khám Nội Tim mạch & Nhà thuốc lớn ở Đà Nẵng. Cho bệnh nhân cao huyết áp mượn đeo thử 7 ngày → Tỷ lệ chốt mua đạt trên 75%!", "<b>3. Chính sách Giữ chân & Lan tỏa (Retention & Referral):</b> Tặng 3 tháng gói Gia Đình VIP cho khách hàng giới thiệu người quen; chiết khấu 15% cho CLB Người cao tuổi mua theo nhóm."]}, {"num": 19, "tag": "6. MÔ HÌNH KINH DOANH – BUSINESS MODEL CANVAS", "title": "MÔ HÌNH KINH DOANH 9 KHỐI (BUSINESS MODEL CANVAS)", "subtitle": "Kết hợp doanh thu bán thiết bị phần cứng (One-off Hardware) và doanh thu thuê bao định kỳ (Recurring SaaS)", "layout": "table", "headers": ["Khối Mô Hình Kinh Doanh", "Nội Dung Triển Khai Thực Tế Của STROKEGUARD - BAND"], "rows": [["1. Phân khúc khách hàng (CS)", "Người mua: Con cái 28-50 tuổi đi làm bận rộn | Người đeo: Ông bà 55-85 tuổi có bệnh nền tim mạch/huyết áp | B2B: Phòng khám, Viện dưỡng lão."], ["2. Giải pháp giá trị (VP)", "Canh giấc & sàng lọc Rung nhĩ (AFib) thụ động 24/7 + Phát hiện té ngã 4 bước (94.9%) + Còi SOS & GPS chấm xanh < 1.5s với giá chỉ 890.000đ."], ["3. Kênh phân phối (CH)", "Online (60%): Website chichiaicompanion.com,             </ul>
          </div>
        `;
      } else if (s.layout === 'two_cards') {
        bodyHtml = `
          <div class="card ${s.left_color === 'red' ? 'red' : ''}">
            <div class="card-header" ${editAttr}>${s.left_header}</div>
            <ul class="bullet-list" ${editAttr}>
              ${s.left_bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
          <div class="card ${s.right_color === 'red' ? 'red' : ''}">
            <div class="card-header" ${editAttr}>${s.right_header}</div>
            <ul class="bullet-list" ${editAttr}>
              ${s.right_bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      } else if (s.layout === 'two_imgs') {
        bodyHtml = `
          <div style="display:flex; flex-direction:column; gap:10px; grid-column: 1 / -1;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; flex:1; min-height:0;">
              <div class="img-box"><img src="${s.left_img}" alt="Diagram 1" /></div>
              <div class="img-box"><img src="${s.right_img}" alt="Diagram 2" /></div>
            </div>
            <div class="bottom-note" ${editAttr}>${s.bottom_note}</div>
          </div>
        `;
      } else if (s.layout === 'video') {
        bodyHtml = `
          <div class="video-box">
            <video controls autoplay muted playsinline poster="${s.poster_src}">
              <source src="${s.video_src}" type="video/mp4" />
            </video>
          </div>
          <div class="card red">
            <div class="card-header" ${editAttr}>${s.right_header}</div>
            <ul class="bullet-list" ${editAttr}>
              ${s.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      } else if (s.layout === 'table') {
        bodyHtml = `
          <div style="display:flex; flex-direction:column; justify-content:space-between; height:100%;">
            <table class="ppt-table" ${editAttr}>
              <thead>
                <tr>${s.headers.map(h => `<th>${h}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${s.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
            <div class="bottom-note" ${editAttr}>${s.bottom_note}</div>
          </div>
        `;
      }

      const canvas = document.getElementById('slideCanvas');
      canvas.innerHTML = `
        <img class="doodle-tr" src="/slide_assets/doodle_top_right.png" alt="" />
        <img class="doodle-bl" src="/slide_assets/doodle_bottom_left.png" alt="" />
        <img class="doodle-br" src="/slide_assets/doodle_bottom_right.png" alt="" />

        <div class="slide-top">
          <div class="slide-logo-row">
            <img class="bq-logo" src="/slide_assets/bq_logo.png" alt="BQCompass" />
            <span class="slide-tag" ${editAttr}>STROKEGUARD • ${s.tag}</span>
          </div>
          <h1 class="slide-h1" ${editAttr}>${s.title}</h1>
          <div class="slide-sub" ${editAttr}>${s.subtitle}</div>
        </div>

        <div class="slide-body layout-${s.layout}">
          ${bodyHtml}
        </div>

        <div class="slide-footer">
          <span>STROKEGUARD – SMART HEALTH BAND | THPT Ngô Quyền, Đà Nẵng (Khang & Trí 11/1) | Cấu trúc khởi nghiệp BQCompass © 2026</span>
          <span class="page-pill">Trang ${s.num} / 25</span>
        </div>
      `;
      renderThumbnails();
    }

    function goToSlide(idx) {
      currentIndex = idx;
      renderSlide();
    }
    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      renderSlide();
    }
    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      renderSlide();
    }
    function toggleEditMode() {
      isEditable = !isEditable;
      const btn = document.getElementById('editBtn');
      btn.classList.toggle('active', isEditable);
      btn.textContent = isEditable ? '✅ Đang Bật Chỉnh Sửa (Bấm vào chữ để sửa)' : '✏️ Bật Chỉnh Sửa Trực Tiếp';
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (isEditable) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });

    renderSlide();
  </script>
</body>
</html>
