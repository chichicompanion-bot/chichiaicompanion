ght_color": "purple", "bullets": ["<b>TAM (Total Addressable Market) — 11.300 Tỷ VNĐ:</b> Việt Nam hiện có hơn 14,2 triệu người cao tuổi (≥60 tuổi) và người mắc bệnh tim mạch, cao huyết áp.", "<b>SAM (Serviceable Available Market) — 2.240 Tỷ VNĐ:</b> Tập trung vào ~2,8 triệu hộ gia đình tại các đô thị lớn (Đà Nẵng, Hà Nội, TP.HCM, Hải Phòng, Cần Thơ...) có con cái thu nhập ổn định.", "<b>SOM (Serviceable Obtainable Market) — 4,5 đến 9 Tỷ VNĐ:</b> Trong 2 năm đầu, STROKEGUARD đặt mục tiêu chiếm lĩnh thị trường tại TP. Đà Nẵng & Miền Trung với sản lượng <b>5.000 – 10.000 thiết bị</b>.", "<b>Tốc độ tăng trưởng (CAGR):</b> Thị trường thiết bị đeo y tế (IoMT) tại Việt Nam tăng trưởng <b>18,5%/năm</b> do tốc độ già hóa dân số nhanh."]}, {"num": 8, "theme": 1, "tag": "2. PHÂN KHÚC KHÁCH HÀNG MỤC TIÊU", "title": "TÁCH BẠCH RÕ: \"NGƯỜI TRẢ TIỀN MUA\" VÀ \"NGƯỜI ĐEO TRỰC TIẾP\"", "subtitle": "Hiểu đúng tâm lý của cả Người Con (Người quyết định mua) lẫn Ông Bà (Người đeo hàng ngày)", "layout": "split_left_img", "left_img": "./slide_assets/illust_06_personas.png", "right_header": "3 PHÂN KHÚC KHÁCH HÀNG MŨI NHỌN", "right_color": "blue", "bullets": ["<b>1. Khách hàng trả tiền (B2C Buyer — Con cái 28-50 tuổi):</b> Nhân viên văn phòng, kỹ sư, tiểu thương bận rộn đi làm cả ngày. Động lực mua: Báo hiếu, xóa bỏ cảm giác bất an khi không ở cạnh bố mẹ 24/24.", "<b>2. Người dùng cuối (End-User — Ông bà / Cha mẹ 55-85 tuổi):</b> Người có tiền sử tăng huyết áp, rối loạn nhịp tim, tiểu đường. Cần thiết bị siêu nhẹ (45x38x14mm), đeo êm tay, không cần bấm nút, có còi hú tại chỗ.", "<b>3. Khách hàng tổ chức (B2B — Phòng khám & Viện dưỡng lão):</b> Viện dưỡng lão, trung tâm chăm sóc người cao tuổi, phòng khám nội tim mạch cần theo dõi 20–50 bệnh nhân cùng lúc trên Web Dashboard."]}, {"num": 9, "theme": 0, "tag": "3. CÔNG NGHỆ & GIÁ TRỊ CỐT LÕI", "title": "CÔNG NGHỆ ĐỘT PHÁ: KHỬ NHIỄU QUANG HỌC LMS & SÀNG LỌC RUNG NHĨ (AFib)", "subtitle": "Bạn mang đến giá trị gì? → Biến tín hiệu quang học cổ tay thành hệ thống cảnh báo sớm đột quỵ chuẩn xác", "layout": "split", "badge": "03", "left_header": "3 GIÁ TRỊ CÔNG NGHỆ CỐT LÕI TẠI BIÊN (EDGE AI)", "left_color": "teal", "bullets": ["<b>1. Bộ lọc thích nghi LMS (Least Mean Squares):</b> Khi người đeo cử động tay, sóng PPG bị nhiễu nặng. STROKEGUARD dùng vector gia tốc 3 trục từ MPU-6050 làm tham chiếu để <b>triệt tiêu &gt;80% nhiễu cử động</b>: <code>e(n) = d(n) - Wᵀ(n)x(n)</code>.", "<b>2. Sàng lọc sớm Rung nhĩ (AFib) qua biến thiên HRV:</b> Trích xuất liên tục khoảng R-R Interval (IBI) từ MAX30102. Tính toán chỉ số SDNN và RMSSD. Khi <b>RMSSD &gt; 75ms</b> kèm nhịp loạn hỗn loạn → Cảnh báo sớm nguy cơ huyết khối đột quỵ!", "<b>3. Trích xuất tần số hô hấp (RPM) qua sóng PPG (RIIV):</b> Lọc dải thông 0.1Hz – 0.5Hz để đo nhịp thở (6–30 lần/phút) không cần đeo đai ngực, phát hiện sớm suy hô hấp cấp."], "right_img": "./slide_assets/illust_07_lms_filter.png"}, {"num": 10, "theme": 4, "tag": "3. CÔNG NGHỆ • TÉ NGÃ 4 GIAI ĐOẠN & 6 KHỐI LINH KIỆN THỰC TẾ", "title": "MÔ HÌNH TÉ NGÃ 4 GIAI ĐOẠN & CẤU TRÚC 6 LINH KIỆN THỰC TẾ", "subtitle": "Kết hợp thuật toán động lực học 4 bước (loại bỏ 95% báo giả) và mạch nhúng 3 tầng ESP32 + MAX30102 + MPU-6050", "layout": "two_imgs", "left_img": "./slide_assets/illust_08_fall_4stages.png", "right_img": "./slide_assets/illust_hw_components_hd.png", "bottom_note": "<b>6 Khối linh kiện chuẩn xác:</b> (1) ESP32-S3/C3 SuperMini • (2) Quang học PPG MAX30102 • (3) Gia tốc 6 trục MPU-6050 • (4) Nhiệt độ da MAX30205 • (5) Định vị GPS NEO-6M/ATGM336H • (6) Mạch sạc TP4056 + Pin Li-Po 400mAh + Còi Buzzer 5V & Nút SOS."}, {"num": 11, "theme": 0, "tag": "4. SẢN PHẨM & HỆ SINH THÁI PHẦN MỀM", "title": "SẢN PHẨM THỰC TẾ: VÒNG TAY STROKEGUARD & WEB DASHBOARD 3D", "subtitle": "Hệ thống đã hoàn thiện từ mạch phần cứng đến nền tảng Web trực tuyến tại chichiaicompanion.com", "layout": "split", "badge": "04", "left_header": "BỘ ĐÔI SẢN PHẨM HOÀN CHỈNH (HARDWARE + 3D WEB)", "left_color": "teal", "bullets": n cái ấn tượng với mô hình Cơ thể 3D & Chấm xanh GPS thời gian thực."}, {"num": 13, "theme": 2, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 1)", "title": "CÂU HỎI 1: TẠI SAO KHÁCH HÀNG CẦN SẢN PHẨM NÀY?", "subtitle": "Nhu cầu ấy là \"BẮT BUỘC PHẢI CÓ\", \"CẦN PHẢI CÓ\" hay đơn giản chỉ là \"SẢN PHẨM THAY THẾ\"?", "layout": "split", "badge": "1", "left_header": "KHẲNG ĐỊNH: ĐÂY LÀ SẢN PHẨM \"BẮT BUỘC PHẢI CÓ\" (MUST-HAVE)", "left_color": "red", "bullets": ["<b>1. Không phải Vitamin, mà là Thuốc Cứu Mạng (Painkiller):</b> Với gia đình có người cao tuổi mắc bệnh cao huyết áp, tim mạch hoặc từng tai biến nhẹ, nguy cơ đột quỵ và té ngã ban đêm là mối đe dọa sinh tử hiện hữu mỗi ngày.", "<b>2. Tại sao máy đo huyết áp truyền thống KHÔNG thể thay thế?</b> Máy đo huyết áp bắp tay hay máy kẹp SpO₂ ngón tay chỉ đo được khi người bệnh <b>CÒN TỈNH TÁO</b> và chủ động ngồi đo. Nhưng khi đột quỵ ập đến lúc 2 giờ sáng hoặc ngất trong nhà tắm, bệnh nhân mất hoàn toàn khả năng tự gọi cứu hộ!", "<b>3. Giá trị của 'Giờ Vàng' (3 – 4.5 giờ đầu):</b> Đưa bệnh nhân đến viện trong Giờ Vàng giúp phục hồi tới 90%. Trễ Giờ Vàng đồng nghĩa với liệt giường suốt đời (chi phí 100 – 300 triệu VNĐ) hoặc tử vong."], "right_img": "./slide_assets/illust_09_why_need.png"}, {"num": 14, "theme": 0, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 2)", "title": "CÂU HỎI 2: TẠI SAO KHÁCH HÀNG LẠI PHẢI MUA SẢN PHẨM ẤY TỪ BẠN?", "subtitle": "4 lợi thế độc quyền giúp STROKEGUARD vượt trội hoàn toàn so với Smartwatch thương mại ngoại nhập", "layout": "split_left_img", "left_img": "./slide_assets/illust_10_why_us_4pillars.png", "right_header": "4 LÝ DO KHÁCH HÀNG CHỌN STROKEGUARD - BAND", "right_color": "teal", "bullets": ["<b>1. Giám sát Rung nhĩ & Đột quỵ THỤ ĐỘNG 24/7:</b> Apple Watch đòi hỏi người dùng phải chủ động đặt ngón tay lên núm xoay Digital Crown trong 30 giây mới đo được ECG. Ngược lại, STROKEGUARD tự động quét HRV (RMSSD) & SpO₂ liên tục ngay cả khi ông bà đang ngủ say!", "<b>2. Tích hợp đồng thời 4-trong-1 chuyên biệt cho người già:</b> Kết hợp (1) Sàng lọc AFib + (2) Nhận diện té ngã 4 bước + (3) Còi Buzzer 5V hú tại chỗ + (4) Định vị GPS thời gian thực.", "<b>3. Thiết kế Việt hóa 100% — Không rào cản công nghệ:</b> Người cao tuổi chỉ cần đeo vào tay; con cháu mở link Web 3D là thấy ngay nhịp đập trái tim & chấm xanh GPS.", "<b>4. Bảo hành & Tùy biến ngưỡng sinh lý tại địa phương:</b> Hỗ trợ hiệu chỉnh ngưỡng nhịp tim cá nhân hóa ngay tại Đà Nẵng & Việt Nam."]}, {"num": 15, "theme": 5, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 3)", "title": "CÂU HỎI 3: TẠI SAO KHÁCH HÀNG LẠI PHẢI MUA SẢN PHẨM ẤY NGAY BÂY GIỜ?", "subtitle": "Tính cấp bách về thời điểm y tế, xã hội và kinh tế khiến khách hàng không thể chần chừ", "layout": "split", "badge": "3", "left_header": "3 ĐỘNG LỰC KHIẾN KHÁCH HÀNG PHẢI HÀNH ĐỘNG NGAY HÔM NAY", "left_color": "red", "bullets": ["<b>1. Đột quỵ không bao giờ báo trước ngày giờ:</b> Các cơn Rung nhĩ kịch phát và tai biến mạch máu não thường xảy ra đột ngột vào ban đêm hoặc khi thời tiết chuyển mùa. Chờ đến khi có triệu chứng rõ rệt thì đã quá muộn!", "<b>2. Xu hướng gia đình hạt nhân & Bố mẹ già ở một mình:</b> Tại các đô thị như Đà Nẵng, con cái đi làm từ 7h sáng đến 6h tối. Ông bà ở nhà một mình 8 – 12 tiếng mỗi ngày mà không có thiết bị bảo vệ tự động.", "<b>3. Bài toán chi phí: 890.000đ hôm nay vs. 200.000.000đ ngày mai:</b> Mua STROKEGUARD ngay hôm nay chỉ tốn 890.000 VNĐ (chưa bằng 1% chi phí phẫu thuật và điều trị nội trú khi phát hiện đột quỵ muộn).", "<b>4. Chính sách Đeo thử 7 ngày & Bảo hành đổi mới:</b> Khách hàng không chịu bất kỳ rủi ro nào khi trang bị ngay cho cha mẹ."], "right_img": "./slide_assets/illust_11_why_now_clock.png"}, {"num": 16, "theme": 1, "tag": "5. TRẢ LỜI 4 CÂU HỎI CỐT LÕI CỦA BQCOMPASS (CÂU HỎI 4)", "title": "CÂU HỎI 4: TẠI SAO KHÁCH HÀNG CHẤP NHẬN MUA VỚI GIÁ 890.000 VNĐ?", "subtitle": "Phân tích tâm lý định giá (Pricing Psychology) và giá trị vượt trội trên từng đồng chi phí", "layout": "split_left_img", "left_img": "./slide_assets/illust_12_why_price.png", "right_header": "TẠI SAO 890.000 VNĐ LÀ \"MỨC GIÁ VÀNG\" (SWEET SPOT)?", "right_color": "blue", "bullets": ["<b>1. Rẻ hơn 10 – 13 lần so với Smartwatch ngoại nhập:</b> Apple Watch Series có giá từ 11.499.000đ, vòng đeo WHOOP tốn 9.220.000đ/năm tiền thuê bao. Với <b>890.000đ</b>, STROKEGUARD phá vỡ hoàn toàn rào cản tài chính.", "<b>2. Nằm trong ngưỡng 'Chi tiêu báo hiếu không cần đắn đo':</b> 890.000đ chỉ tương đương giá của 1 hộp sữa bột canxi cho người già hoặc 1 máy đo huyết áp cơ bản. Con cái mua tặng bố mẹ ngay trong kỳ lương tháng.", "<b>3. Mua 1 được 4 thiết bị trong 1:</b> Thay vì mua riêng Máy đo SpO₂ (500k) + Báo ngã (1.500k) + Định vị GPS (1.200k) = 3.200.000đ, khách hàng chỉ trả 890.000đ.", "<b>4. Gói dịch vụ Gia Đình VIP siêu rẻ (49.000đ/tháng):</b> Chỉ <b>1.600đ/ngày</b> (rẻ hơn 1 ly trà đá) để nhận cảnh báo SMS/Cuộc gọi khẩn cấp đa thành viên."]}, {"num": 17, "theme": 4, "tag": "5. ĐỐI THỦ CẠNH TRANH, LỢI THẾ CẠNH TRANH & USP", "title": "MA TRẬN SO SÁNH ĐỐI THỦ CẠNH TRANH & ĐIỂM KHÁC BIỆT ĐỘC NHẤT (USP)", "subtitle": "STROKEGUARD lấp đầy khoảng trống giữa Thiết bị y tế đắt đỏ và Smartwatch thể thao thời trang", "layout": "table", "headers": ["Tiêu chí so sánh", "Máy Holter Y Tế", "Apple Watch S12", "WHOOP MG", "Máy kẹp FS20D", "STROKEGUARD (Dự án)"], "rows": [["Mục đích cốt lõi", "Chẩn đoán tại viện", "Thể thao & Tiện ích", "Theo dõi phục hồi", "Đo tĩnh ngón tay", "Cảnh báo sớm Đột quỵ & Té ngã"], ["Giám sát Rung nhĩ (AFib)", "Điện cực dán ngực 24h", "Phải tự bấm đo 30s", "Có (Gói thuê bao đắt)", "Không hỗ trợ", "Tự động 24/7 qua PPG & HRV"], ["Nhận diện té ngã", "Không hỗ trợ", "Có (Dễ báo nhầm)", "Không có", "Không hỗ trợ", "Mô hình 4 giai đoạn (95% đặc hiệu)"], ["Định vị GPS độc lập", "Không tích hợp", "Có GPS", "Không có GPS riêng", "Không tích hợp", "GPS NEO-6M/ATGM336H + Chấm xanh"], ["Còi SOS tại thiết bị", "Không có", "Có", "Không có màn/còi", "Chỉ bíp nhỏ", "Còi Buzzer 5V + Nút SOS/Hủy"], ["Xử lý tại biên (Edge AI)", "Ghi thẻ nhớ đọc sau", "Đồng bộ Cloud", "Phụ thuộc App/Cloud", "Hiển thị tại chỗ", "ESP32 FreeRTOS < 1.5s + Web 3D"], ["Chi phí đầu tư", "> 20.000.000 VNĐ", "Từ 11.499.000 VNĐ", "~9.220.000 VNĐ/năm", "480.000 - 750.000 đ", "890.000 VNĐ (Giá vốn lô 490k)"]], "bottom_note": "<b>Điểm khác biệt độc nhất (USP):</b> Vòng tay y sinh ĐẦU TIÊN tại Việt Nam dưới 1 triệu VNĐ kết hợp Lọc nhiễu LMS + Sàng lọc Rung nhĩ (AFib) thụ động 24/7 + Té ngã 4 giai đoạn + Định vị GPS thời gian thực trên Web 3D."}, {"num": 18, "theme": 2, "tag": "5. CHIẾN LƯỢC PHÁT TRIỂN THỊ TRƯỜNG: SALES & MARKETING", "title": "CHIẾN LƯỢC THÂM NHẬP THỊ TRƯỜNG (GO-TO-MARKET) ĐA KÊNH", "subtitle": "Kết hợp truyền thông cảm xúc 'Báo Hiếu & Giờ Vàng' với mạng lưới Phòng khám Tim mạch & Nhà thuốc", "layout": "split_left_img", "left_img": "./slide_assets/illust_13_gtm_marketing.png", "right_header": "PHỄU BÁN HÀNG & CHIẾN THUẬT CHUYỂN ĐỔI CAO", "right_color": "teal", "bullets": ["<b>1. Chiến dịch Marketing chạm cảm xúc (Awareness):</b> Chuỗi video ngắn 30s <i>'Đừng Để Giờ Vàng Trôi Qua Trong Đêm'</i> trên TikTok, Facebook Reels & Zalo Video nhắm tới tệp con cái 28–50 tuổi. Định vị là 'Món quà Báo Hiếu thiết thực nhất' dịp Lễ Vu Lan, Tết, Ngày Người cao tuổi.", "<b>2. Chiến thuật 'Đeo Thử 7 Ngày Tại Phòng Khám' (Activation):</b> Đặt quầy trưng bày tại các Phòng khám Nội Tim mạch & Nhà thuốc lớn ở Đà Nẵng. Cho bệnh nhân cao huyết áp mượn đeo thử 7 ngày → Tỷ lệ chốt mua đạt trên 75%!", "<b>3. Chính sách Giữ chân & Lan tỏa (Retention & Referral):</b> Tặng 3 tháng gói Gia Đình VIP cho khách hàng giới thiệu người quen; chiết khấu 15% cho CLB Người cao tuổi mua theo nhóm."]}, {"num": 19, "theme": 6, "tag": "6. MÔ HÌNH KINH DOANH – BUSINESS MODEL CANVAS", "title": "MÔ HÌNH KINH DOANH 9 KHỐI (BUSINESS MODEL CANVAS)", "subtitle": "Kết hợp doanh thu bán thiết bị phần cứng (One-off Hardware) và doanh thu thuê bao định kỳ (Recurring SaaS)", "layout": "table", "headers": ["Khối Mô Hình Kinh Doanh", "Nội Dung Triển Khai Thực Tế Của STROKEGUARD - BAND"], "rows": [["1. Phân khúc khách hàng (CS)", "Người mua: Con cái 28-50 tuổi đi làm bận rộn | Người đeo: Ông bà 55-85 tuổi có bệnh nền tim mạch/huyết áp | B2B: Phòng khám, Viện dưỡng lão."], ["2. Giải pháp giá trị (VP)", "Canh giấc & sàng lọc Rung nhĩ (AFib) thụ động 24/7 + Phát hiện té ngã 4 bước (94.9%) + Còi SOS & GPS chấm xanh < 1.5s với giá chỉ 890.000đ."], ["3. Kênh phân phối (CH)", "Online (60%): Website chichiaicompanion.com, Shopee Mall, TikTok/FB | Offline (40%): Phòng khám Tim mạch, Nhà thuốc, CLB Người cao tuổi Đà Nẵng."], ["4. Quan hệ khách hàng (CR)", "Chương trình 'Đeo thử 7 ngày tại phòng khám'; Bảo hành 1 đổi 1 trong 12 tháng; Cảnh báo tự động đa thành viên gia đình."], ["5. Dòng doanh thu (R$)", "Bán phần cứng vòng tay: 890.000 VNĐ/bộ (Lãi gộp 400k) + Thuê bao Gia Đình VIP (SMS/Cuộc gọi khẩn cấp 115 & Lưu trữ đám mây): 49.000đ/tháng."], ["6. Nguồn lực & Hoạt động chính", "Thuật toán nhúng FreeRTOS trên ESP32, bộ lọc LMS, té ngã 4 bước; Nền tảng Web 3D & Bản đồ GPS; Quy trình lắp ráp & kiểm định chất lượng."], ["7. Đối tác & Cơ cấu chi phí (C$)", "Đối tác: Xưởng gia công PCB, Phòng khám tim mạch, Hội Người cao tuổi | Chi phí: Giá vốn sản xuất lô 490.000đ/máy; Chi phí cố định ~18 triệu/tháng."]], "bottom_note": "<b>Mô hình doanh thu kép (Hardware + SaaS):</b> Giúp dự án vừa có dòng tiền dương ngay khi bán máy, vừa có doanh thu định kỳ bền vững hàng tháng."}, {"num": 20, "theme": 5, "tag": "7. TÀI CHÍNH • BÓC TÁCH GIÁ VỐN 6 LINH KIỆN THỰC TẾ (BOM)", "title": "BẢNG GIÁ VỐN 6 KHỐI LINH KIỆN THỰC TẾ & BIÊN LỢI NHUẬN ĐƠN VỊ", "subtitle": "Dựa trên đúng cấu hình phần cứng: ESP32-S3/C3, MAX30102, MPU-6050, MAX30205, GPS NEO-6M/ATGM336H & TP4056", "layout": "table", "headers": ["STT", "Tên linh kiện thực tế trong vòng tay STROKEGUARD", "Giá lẻ (1 máy)", "Giá sản xuất lô (≥ 100 máy)", "Tỷ trọng"], "rows": [["1", "Vi điều khiển ESP32-S3 / ESP32-C3 SuperMini (Dua     function goToSlide(idx) {
      currentIndex = idx;

    }
    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;

    }
    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      renderSlide();
    }
    function toggleEditMode() {
      isEditable = !isEditable;
      const btn = document.getElementById('editBtn');
      btn.classList.toggle('active', isEditable);
      btn.textContent = isEditable ? '✅ Đang Bật Chỉnh Sửa (Nhấp vào chữ để sửa)' : '✏️ Bật Chỉnh Sửa Chữ';
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (isEditable) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });
