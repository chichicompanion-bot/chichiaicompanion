ột mình khi cả nhà đang ngủ say. Vòng tay vẫn âm thầm theo dõi nhịp tim.", "<b>Cảnh 2 (07s - 15s):</b> Cơn Rung nhĩ kịch phát làm nhịp tim vọt lên 168 BPM. Ông Minh choáng váng ngã xuống sàn nhà và nằm bất động.", "<b>Cảnh 3 (15s - 22s):</b> Chỉ trong 1,5 giây, chip xử lý tại biên phát hiện 4 giai đoạn té ngã, lập tức hú còi báo động và gửi tọa độ GPS về điện thoại người thân.", "<b>Cảnh 4 (22s - 30s):</b> Nhờ cấp cứu kịp thời trong Giờ Vàng, Ông Minh bình phục hoàn toàn. STROKEGUARD — Người gác đêm cho trái tim Việt!"]}, {"num": 5, "title": "1. DẪN CHỨNG SỐ LIỆU THỐNG KÊ VỀ ĐỘT QUỴ & TÉ NGÃ TẠI VIỆT NAM", "subtitle": "Số liệu thực tế từ Bộ Y tế & Hội Đột quỵ Việt Nam chứng minh tính cấp thiết của dự án", "layout": "split", "badge": "01", "left_header": "THỐNG KÊ BÁO ĐỘNG ĐỎ TẠI VIỆT NAM", "left_color": "red", "bullets": ["<b>200.000+ ca đột quỵ mới/năm:</b> Theo Bộ Y tế, gần 50% trường hợp tử vong hoặc để lại tàn phế nặng nề trong 30 ngày đầu.", "<b>Rung nhĩ (AFib) làm tăng nguy cơ gấp 5 lần:</b> Là nguyên nhân trực tiếp hình thành huyết khối gây tắc mạch máu não nhưng diễn ra âm thầm.", "<b>1,9 triệu tế bào thần kinh chết/phút:</b> Mỗi phút thiếu máu não trôi qua lấy đi hàng triệu tế bào não. Quá 4.5 giờ vàng → Tàn phế suốt đời.", "<b>Hơn 100.000 bệnh nhân tàn phế:</b> Nguyên nhân lớn nhất KHÔNG chỉ do cơn đột quỵ, mà do <b>PHÁT HIỆN MUỘN</b> khi người bệnh ở một mình hoặc ban đêm."], "right_img": "./slide_assets/image3.png"}, {"num": 6, "title": "1. KHẢO SÁT MỨC ĐỘ QUAN TÂM CỦA 120 HỘ GIA ĐÌNH TẠI TP. ĐÀ NẴNG", "subtitle": "Khảo sát thực tế 120 hộ gia đình có người cao tuổi (≥ 55 tuổi) tại quận Sơn Trà & Hải Châu, Đà Nẵng", "layout": "split_left_img", "left_img": "./slide_assets/illust_04_survey_charts.png", "right_header": "3 PHÁT HIỆN QUAN TRỌNG TỪ KHẢO SÁT THỰC TẾ", "right_color": "green", "bullets": ["<b>1. Nỗi lo thường trực của con cái (89,2%):</b> Gần 9/10 người trưởng thành đi làm luôn nơm nớp lo sợ bố mẹ ở nhà một mình bị choáng ngã hoặc tăng huyết áp đột ngột mà không ai hay biết.", "<b>2. Rào cản giá của Smartwatch ngoại (84,5%):</b> Khách hàng cho biết Apple Watch hay Samsung Watch có giá từ 7 – 15 triệu VNĐ là quá đắt, pin nhanh hết và giao diện quá rắc rối với người lớn tuổi.", "<b>3. Điểm ngọt về giá dưới 1 triệu VNĐ (91,7%):</b> Hơn 91% người được hỏi khẳng định <b>SẴN SÀNG MUA NGAY</b> một chiếc vòng tay chuyên biệt báo động đột quỵ & té ngã nếu mức giá dưới 1.000.000 VNĐ.", "<b>→ Cơ hội vàng cho STROKEGUARD:</b> Đánh trúng phân khúc đại chúng với mức giá chỉ <b>890.000 VNĐ</b> cùng tính năng đo thụ động 24/7 hoàn toàn tự động!"]}, {"num": 7, "title": "2. QUY MÔ THỊ TRƯỜNG MỤC TIÊU (TAM – SAM – SOM)", "subtitle": "Đánh giá tiềm năng thị trường từ toàn quốc (TAM) đến mục tiêu khai thác thực tế tại Đà Nẵng & Miền Trung (SOM)", "layout": "split_left_img", "left_img": "./slide_assets/illust_05_tam_sam_som.png", "right_header": "PHÂN TÍCH CHI TIẾT TAM – SAM – SOM", "right_color": "purple", "bullets": ["<b>TAM (Total Addressable Market) — 11.300 Tỷ VNĐ:</b> Việt Nam hiện có hơn 14,2 triệu người cao tuổi (≥60 tuổi) và người mắc bệnh tim mạch, cao huyết áp.", "<b>SAM (Serviceable Available Market) — 2.240 Tỷ VNĐ:</b> Tập trung vào ~2,8 triệu hộ gia đình tại các đô thị lớn (Đà Nẵng, Hà Nội, TP.HCM, Hải Phòng, Cần Thơ...) có con cái thu nhập ổn định.", "<b>SOM (Serviceable Obtainable Market) — 4,5 đến 9 Tỷ VNĐ:</b> Trong 2 năm đầu, STROKEGUARD đặt mục tiêu chiếm lĩnh thị trường tại TP. Đà Nẵng & Miền Trung với sản lượng <b>5.000 – 10.000 thiết bị</b>.", "<b>Tốc độ tăng trưởng (CAGR):</b> Thị trường thiết bị đeo y tế (IoMT) tại Việt Nam tăng trưởng <b>18,5%/năm</b> do tốc độ già hóa dân số nhanh."]}, {"num": 8, "title": "2. PHÂN KHÚC KHÁCH HÀNG: \"NGƯỜI TRẢ TIỀN MUA\" & \"NGƯỜI ĐEO\"", "subtitle": "Hiểu đúng tâm lý của cả Người Con (Người quyết định mua) lẫn Ông Bà (Người đeo hàng ngày)", "layout": "split_left_img", "left_img": "./slide_assets/illust_06_personas.png", "right_header": "3 PHÂN KHÚC KHÁCH HÀNG MŨI NHỌN", "right_color": "blue", "bullets": ["<b>1. Khách hàng trả tiền (B2C Buyer — Con cái 28-50 tuổi):</b> Nhân viên văn phòng, kỹ sư, tiểu thương bận rộn đi làm cả ngày. Động lực mua: Báo hiếu, xóa bỏ cảm giác bất an khi không ở cạnh bố mẹ 24/24.", "<b>2. Người dùng cuối (End-User — Ông bà / Cha mẹ 55-85 tuổi):</b> Người có tiền sử tăng huyết áp, rối loạn nhịp tim, tiểu đường. Cần thiết bị siêu nhẹ (45x38x14mm), đeo êm tay, không cần bấm nút, có còi hú tại chỗ.", "<b>3. Khách hàng tổ chức (B2B — Phòng khám & Viện dưỡng lão):</b> Viện dưỡng lão, trung tâm chăm sóc người cao tuổi, phòng khám nội tim mạch cần theo dõi 20–50 bệnh nhân cùng lúc trên Web Dashboard."]}, {"num": 9, "title": "3. CÔNG NGHỆ ĐỘT PHÁ: KHỬ NHIỄU LMS & SÀNG LỌC RUNG NHĨ (AFib)", "subtitle": "Biến tín hiệu quang học cổ tay thành hệ thống cảnh báo sớm đột quỵ chuẩn xác tại biên", "layout": "split", "badge": "03", "left_header": "3 GIÁ TRỊ CÔNG NGHỆ CỐT LÕI TẠI BIÊN (EDGE AI)", "left_color": "teal", "bullets": ["<b>1. Bộ lọc thích nghi LMS (Least Mean Squares):</b> Khi người đeo cử động tay, sóng PPG bị nhiễu nặng. STROKEGUARD dùng vector gia tốc 3 trục từ MPU-6050 làm tham chiếu để <b>triệt tiêu &gt;80% nhiễu cử động</b>: <code>e(n) = d(n) - Wᵀ(n)x(n)</code>.", "<b>2. Sàng lọc sớm Rung nhĩ (AFib) qua biến thiên HRV:</b> Trích xuất liên tục khoảng R-R Interval (IBI) từ MAX30102. Tính toán chỉ số SDNN và RMSSD. Khi <b>RMSSD &gt; 75ms</b> kèm nhịp loạn hỗn loạn → Cảnh báo sớm nguy cơ huyết khối đột quỵ!", "<b>3. Trích xuất tần số hô hấp (RPM) qua sóng PPG (RIIV):</b> Lọc dải thông 0.1Hz – 0.5Hz để đo nhịp thở (6–30 lần/phút) không cần đeo đai ngực, phát hiện sớm suy hô hấp cấp."], "right_img": "./slide_assets/illust_07_lms_filter.png"}, {"num": 10, "title": "3. MÔ HÌNH TÉ NGÃ 4 GIAI ĐOẠN & 6 KHỐI LINH KIỆN THỰC TẾ", "subtitle": "Kết hợp thuật toán động lực học 4 bước (loại bỏ 95% báo giả) và mạch nhúng 3 tầng ESP32 + MAX30102 + MPU-6050", "layout": "two_imgs", "left_img": "./slide_assets/illust_08_fall_4stages.png", "right_img": "./slide_assets/illust_hw_components_hd.png", "bottom_note": "<b>6 Khối linh kiện chuẩn xác:</b> (1) ESP32-S3/C3 SuperMini • (2) Quang học PPG MAX30102 • (3) Gia tốc 6 trục MPU-6050 • (4) Nhiệt độ da MAX30205 • (5) Định vị GPS NEO-6M/ATGM336H • (6) Mạch sạc TP4056 + Pin Li-Po 400mAh + Còi Buzzer 5V & Nút SOS."}, {"num": 11, "title": "4. SẢN PHẨM THỰC TẾ: VÒNG TAY STROKEGUARD & WEB DASHBOARD 3D", "subtitle": "Hệ thống đã hoàn thiện từ mạch phần cứng đến nền tảng Web trực tuyến tại chichiaicompanion.com", "layout": "split", "badge": "04", "left_header": "BỘ ĐÔI SẢN PHẨM HOÀN CHỈNH (HARDWARE + 3D WEB)", "left_color": "teal", "bullets": ["<b>1. Vòng đeo tay phần cứng STROKEGUARD (45 × 38 × 14 mm):</b> Vi điều khiển ESP32 chạy đa luồng FreeRTOS; cảm biến PPG MAX30102 & nhiệt độ MAX30205; gia tốc 6 trục MPU-6050 + GPS NEO-6M/ATGM336H; Còi Buzzer 5V tại chỗ + Nút bấm SOS & Nút hủy báo động nhầm; Sạc USB Type-C.", "<b>2. Nền tảng Web Dashboard (chichiaicompanion.com):</b>", "• Giao diện <b>Nền Đen (Dark Mode)</b> y sinh hiện đại trên cả máy tính & điện thoại.", "• Mô hình <b>Cơ thể & Quả tim 3D chân thực</b> co bóp theo đúng nhịp tim người đeo.", "• <b>Bản đồ GPS với Chấm Xanh Lá</b> đứng yên hoặc di chuyển theo bước chân thực tế.", "• <b>Biển báo động đỏ đột quỵ</b> bật giữa màn hình ngay khi chỉ số vượt ngưỡng!"], "right_img": "./slide_assets/illust_web3d_clean_hd.png"}, {"num": 12, "title": "4. KẾT QUẢ THỰC NGHIỆM TRÊN 15 NGƯỜI & PHẢN HỒI NGƯỜI DÙNG THỬ", "subtitle": "Đo kiểm đối chứng 1.000 mẫu PPG với máy y tế chuyên dụng FS20D & mô phỏng 5 kịch bản sinh hoạt", "layout": "table", "headers": ["Giả thuyết / Hạng mục kiểm thử", "Phương pháp thử nghiệm", "Kết quả đạt được", "Đánh giá"], "rows": [["1. Khử nhiễu LMS & Đo Nhịp tim (HR)", "Đo trên 15 người (ngồi tĩnh & đi bộ vung tay)", "Khử >80% nhiễu; Sai số ±2.1 BPM (2.6%)", "ĐẠT (Cao)"], ["2. Đo nồng độ Oxy máu (SpO2)", "Đối chứng trực tiếp với máy đo y tế FS20D", "Sai số chỉ ±1.8% (dải đo 90% - 100%)", "ĐẠT (Cao)"], ["3. Sàng lọc Rung nhĩ (AFib) qua HRV", "Kiểm thử ngưỡng RMSSD > 75ms & Poincaré", "Nhận diện đúng chuỗi nhịp loạn kịch phát", "ĐẠT"], ["4. Mô hình nhận diện té ngã 4 giai đoạn", "3 tư thế ngã + 5 hành vi giả (ngồi mạnh, vung tay)", "Độ nhạy 94.9% | Độ đặc hiệu 95.0%", "VƯỢT MỤC TIÊU"], ["5. Thời lượng Pin & Độ trễ cảnh báo SOS", "Pin Li-Po 400mAh (Power Duty Cycling 38mA)", "Hoạt động 21,5 giờ | Độ trễ SOS < 1.5 giây", "ĐẠT"]], "bottom_note": "<b>Phản hồi khách hàng thử nghiệm:</b> 93,3% người cao tuổi hài lòng vì vòng tay nhẹ, tự động, có nút hủy báo nhầm trong 10s; 100% con cái ấn tượng với mô hình Cơ thể 3D & Chấm xanh GPS thời gian thực."}, {"num": 13, "title": "CÂU HỎI 1: TẠI SAO KHÁCH HÀNG CẦN SẢN PHẨM NÀY?", "subtitle": "Nhu cầu ấy là \"BẮT BUỘC PHẢI CÓ\", \"CẦN PHẢI CÓ\" hay đơn giản chỉ là \"SẢN PHẨM THAY THẾ\"?", "layout": "split", "badge": "1", "left_header": "KHẲNG ĐỊNH: SẢN PHẨM \"BẮT BUỘC PHẢI CÓ\" (MUST-HAVE)", "left_color": "red", "bullets": ["<b>1. Không phải Vitamin, mà là Thuốc Cứu Mạng (Painkiller):</b> Với gia đình có người cao tuổi mắc bệnh cao huyết áp, tim mạch hoặc từng tai biến nhẹ, nguy cơ đột quỵ và té ngã ban đêm là mối đe dọa sinh tử hiện hữu mỗi ngày.", "<b>2. Tại sao máy đo huyết áp truyền thống KHÔNG thể thay thế?</b> Máy đo huyết áp bắp tay hay máy kẹp SpO₂ ngón tay chỉ đo được khi người bệnh <b>CÒN TỈNH TÁO</b> và chủ động ngồi đo. Nhưng khi đột quỵ ập đến lúc 2 giờ sáng hoặc ngất trong nhà tắm, bệnh nhân mất hoàn toàn khả năng tự gọi cứu hộ!", "<b>3. Giá trị của 'Giờ Vàng' (3 – 4.5 giờ đầu):</b> Đưa bệnh nhân đến viện trong Giờ Vàng giúp phục hồi tới 90%. Trễ Giờ Vàng đồng nghĩa với liệt giường suốt đời (chi phí 100 – 300 triệu VNĐ) hoặc tử vong."], "right_img": "./slide_assets/illust_09_why_need.png"}, {"num": 14, "title": "CÂU HỎI 2: TẠI SAO KHÁCH HÀNG LẠI PHẢI MUA SẢN PHẨM ẤY TỪ BẠN?", "subtitle": "4 lợi thế độc quyền giúp STROKEGUARD vượt trội hoàn toàn so với Smartwatch thương mại ngoại nhập", "layout": "four_quadrants", "quads": [{"num": "01", "color": "red", "title": "1. GIÁM SÁT RUNG NHĨ & ĐỘT QUỴ THỤ ĐỘNG 24/7", "bullets": ["<b>Tự động hoàn toàn cả khi ngủ:</b> Apple Watch đòi hỏi người dùng phải chủ động đặt ngón tay lên núm xoay Digital Crown trong 30 giây mới đo được ECG.", "<b>Canh giấc ban đêm:</b> STROKEGUARD tự động quét biến thiên nhịp tim HRV (RMSSD) & SpO₂ liên tục 24/24 ngay cả khi ông bà đang ngủ say!"]}, {"num": "02", "color": "teal", "title": "2. ĐIỆN TOÁN BIÊN &lt; 1.5 GIÂY & CÒI SOS TẠI CHỖ", "bullets": ["<b>Xử lý trực tiếp trên chip ESP32:</b> Thực thi bộ lọc thích nghi LMS và nhận diện té ngã 4 bước ngay trên vòng tay (FreeRTOS).", "<b>Không phụ thuộc đám mây:</b> Còi Buzzer 5V hú báo động đánh thức người nhà ngay lập tức kể cả khi nhà mất mạng Wi-Fi!"]}, {"num": "03", "color": "blue", "title": "3. VIỆT HÓA 100% & MÔ HÌNH TIM/NÃO 3D TRỰC QUAN", "bullets": ["<b>Không rào cản công nghệ:</b> Người cao tuổi chỉ cần đeo vào cổ tay, không phải thao tác màn hình cảm ứng nhỏ phức tạp.", "<b>Giám sát từ xa dễ hiểu:</b> Con cháu mở link Web 3D thấy ngay quả tim co bóp theo nhịp thực và chấm xanh GPS di chuyển!"]}, {"num": "04", "color": "amber", "title": "4. GIÁ CHỈ BẰNG 1/10 & TÙY BIẾN TẠI VIỆT NAM", "bullets": ["<b>Đột phá về chi phí:</b> Chỉ 890.000 VNĐ/bộ (rẻ hơn 12 lần so với Apple Watch 11,5 triệu hay WHOOP 9,2 triệu/năm).", "<b>Hậu mãi & Cá nhân hóa:</b> Linh kiện phổ thông, dễ bảo hành và tùy biến ngưỡng cảnh báo theo bệnh lý riêng tại Đà Nẵng."]}]}, {"num": 15, "title": "CÂU HỎI 3: TẠI SAO KHÁCH HÀNG LẠI PHẢI MUA SẢN PHẨM ẤY NGAY BÂY GIỜ?", "subtitle": "Tính cấp bách về thời điểm y tế, xã hội và kinh tế khiến khách hàng không thể chần chừ", "layout": "split", "badge": "3", "left_header": "3 ĐỘNG LỰC KHIẾN KHÁCH HÀNG PHẢI HÀNH ĐỘNG NGAY HÔM NAY", "left_color": "red", "bullets": ["<b>1. Đột quỵ không bao giờ báo trước ngày giờ:</b> Các cơn Rung nhĩ kịch phát và tai biến mạch máu não thường xảy ra đột ngột vào ban đêm hoặc khi thời tiết chuyển mùa. Chờ đến khi có triệu chứng rõ rệt thì đã quá muộn!", "<b>2. Xu hướng gia đình hạt nhân & Bố mẹ già ở một mình:</b> Tại các đô thị như Đà Nẵng, con cái đi làm từ 7h sáng đến 6h tối. Ông bà ở nhà một mình 8 – 12 tiếng mỗi ngày mà không có thiết bị bảo vệ tự động.", "<b>3. Bài toán chi phí: 890.000đ hôm nay vs. 200.000.000đ ngày mai:</b> Mua STROKEGUARD ngay hôm nay chỉ tốn 890.000 VNĐ (chưa bằng 1% chi phí phẫu thuật và điều trị nội trú khi phát hiện đột quỵ muộn).", "<b>4. Chính sách Đeo thử 7 ngày & Bảo hành đổi mới:</b> Khách hàng không chịu bất kỳ rủi ro nào khi trang bị ngay cho cha mẹ."], "right_img": "./slide_assets/illust_11_why_now_clock.png"}, {"num": 16, "title": "CÂU HỎI 4: TẠI SAO KHÁCH HÀNG CHẤP NHẬN MUA VỚI GIÁ 890.000 VNĐ?", "subtitle": "Phân tích tâm lý định giá (Pricing Psychology) và giá trị vượt trội trên từng đồng chi phí", "layout": "split_left_img", "left_img": "./slide_assets/illust_12_why_price.png", "right_header": "TẠI SAO 890.000 VNĐ LÀ \"MỨC GIÁ VÀNG\" (SWEET SPOT)?", "right_color": "blue", "bullets": ["<b>1. Rẻ hơn 10 – 13 lần so với Smartwatch ngoại nhập:</b> Apple Watch Series có giá từ 11.499.000đ, vòng đeo WHOOP tốn 9.220.000đ/năm tiền thuê bao. Với <b>890.000đ</b>, STROKEGUARD phá vỡ hoàn toàn rào cản tài chính.", "<b>2. Nằm trong ngưỡng 'Chi tiêu báo hiếu không cần đắn đo':</b> 890.000đ chỉ tương đương giá của 1 hộp sữa bột canxi cho người già hoặc 1 máy đo huyết áp cơ bản. Con cái mua tặng bố mẹ ngay trong kỳ lương tháng.", "<b>3. Mua 1 được 4 thiết bị trong 1:</b> Thay vì mua riêng Máy đo SpO₂ (500k) + Báo ngã (1.500k) + Định vị GPS (1.200k) = 3.200.000đ, khách hàng chỉ trả 890.000đ.", "<b>4. Gói dịch vụ Gia Đình VIP siêu rẻ (49.000đ/tháng):</b> Chỉ <b>1.600đ/ngày</b> (rẻ hơn 1 ly trà đá) để nhận cảnh báo SMS/Cuộc gọi khẩn cấp đa thành viên."]}, {"num": 17, "title": "5. MA TRẬN SO SÁNH ĐỐI THỦ CẠNH TRANH & ĐIỂM KHÁC BIỆT (USP)", "subtitle": "STROKEGUARD lấp đầy khoảng trống giữa Thiết bị y tế đắt đỏ và Smartwatch thể thao thời trang", "layout": "table", "headers": ["Tiêu chí so sánh", "Máy Holter Y Tế", "Apple Watch S12", "WHOOP MG", "Máy kẹp FS20D", "STROKEGUARD (Dự án)"], "rows": [["Mục đích cốt lõi", "Chẩn đoán tại viện", "Thể thao & Tiện ích", "Theo dõi phục hồi", "Đo tĩnh ngón tay", "Cảnh báo sớm Đột quỵ & Té ngã"], ["Giám sát Rung nhĩ (AFib)", "Điện cực dán ngực 24h", "Phải tự bấm đo 30s", "Có (Gói thuê bao đắt)", "Không hỗ trợ", "Tự động 24/7 qua PPG & HRV"], ["Nhận diện té ngã", "Không hỗ trợ", "Có (Dễ báo nhầm)", "Không có", "Không hỗ trợ", "Mô hình 4 giai đoạn (95% đặc hiệu)"], ["Định vị GPS độc lập", "Không tích hợp", "Có GPS", "Không có GPS riêng", "Không tích hợp", "GPS NEO-6M/ATGM336H + Chấm xanh"], ["Còi SOS tại thiết bị", "Không có", "Có", "Không có màn/còi", "Chỉ bíp nhỏ", "Còi Buzzer 5V + Nút SOS/Hủy"], ["Xử lý tại biên (Edge AI)", "Ghi thẻ nhớ đọc sau", "Đồng bộ Cloud", "Phụ thuộc App/Cloud", "Hiển thị tại chỗ", "ESP32 FreeRTOS < 1.5s + Web 3D"], ["Chi phí đầu tư", "> 20.000.000 VNĐ", "Từ 11.499.000 VNĐ", "~9.220.000 VNĐ/năm", "480.000 - 750.000 đ", "890.000 VNĐ (Giá vốn lô 490k)"]], "bottom_note": "<b>Điểm khác biệt độc nhất (USP):</b> Vòng tay y sinh ĐẦU TIÊN tại Việt Nam dưới 1 triệu VNĐ kết hợp Lọc nhiễu LMS + Sàng lọc Rung nhĩ (AFib) thụ động 24/7 + Té ngã 4 giai đoạn + Định vị GPS thời gian thực trên Web 3D."}, {"num": 18, "title": "5. CHIẾN LƯỢC THÂM NHẬP THỊ TRƯỜNG (SALES & MARKETING)", "subtitle": "Kết hợp truyền thông cảm xúc 'Báo Hiếu & Giờ Vàng' với mạng lưới Phòng khám Tim mạch & Nhà thuốc", "layout": "split_left_img", "left_img": "./slide_assets/illust_13_gtm_marketing.png", "right_header": "PHỄU BÁN HÀNG & CHIẾN THUẬT CHUYỂN ĐỔI CAO", "right_color": "teal", "bullets": ["<b>1. Chiến dịch Marketing chạm cảm xúc (Awareness):</b> Chuỗi video ngắn 30s <i>'Đừng Để Giờ Vàng Trôi Qua Trong Đêm'</i> trên TikTok, Facebook Reels & Zalo Video nhắm tới tệp con cái 28–50 tuổi. Định vị là 'Món quà Báo Hiếu thiết thực nhất' dịp Lễ Vu Lan, Tết, Ngày Người cao tuổi.", "<b>2. C             <div class="hero-center-box">
              <div class="hero-pill-top" ${editAttr}>${s.pill}</div>
              <h1 class="hero-main-title" ${editAttr}>${s.title}</h1>
              <div class="hero-main-sub" ${editAttr}>${s.subtitle}</div>
              <div class="hero-badges-row" ${editAttr}>
                ${s.badges.map(b => `<span class="hero-badge-item">${b}</span>`).join('')}
              </div>
            </div>
          </div>
        `;
        renderThumbnails();
        return;
      }

      let bodyHtml = '';
      if (s.layout === 'split') {
        bodyHtml = `
          <div class="card ${s.left_color || ''}">
            <div class="card-header" ${editAttr}>
              <span class="pill-circle">${s.badge || s.num}</span>
              <span>${s.left_header}</span>
            </div>
            <ul class="bullet-list" ${editAttr}>
              ${s.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
          <div class="img-box">
            <img src="${s.right_img}" alt="Slide Poster Graphic" />
          </div>
        `;
      } else if (s.layout === 'split_left_img') {
        bodyHtml = `
          <div class="img-box">
            <img src="${s.left_img}" alt="Slide Poster Graphic" />
          </div>
          <div class="card ${s.right_color || ''}">
            <div class="card-header" ${editAttr}>
              <span class="pill-circle">${s.num}</span>
              <span>${s.right_header}</span>
            </div>
            <ul class="bullet-list" ${editAttr}>
              ${s.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      } else if (s.layout === 'two_cards') {
        bodyHtml = `
          <div class="card ${s.left_color || ''}">
            <div class="card-header" ${editAttr}>
              <span class="pill-circle">I</span>
              <span>${s.left_header}</span>
            </div>
            <ul class="bullet-list" ${editAttr}>
              ${s.left_bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
          <div class="card ${s.right_color || ''}">
            <div class="card-header" ${editAttr}>
              <span class="pill-circle">II</span>
              <span>${s.right_header}</span>
            </div>
            <ul class="bullet-list" ${editAttr}>
              ${s.right_bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      } else if (s.layout === 'four_quadrants') {
        bodyHtml = s.quads.map(q => `
          <div class="card ${q.color}">
            <div class="card-header" ${editAttr}>
              <span class="pill-circle">${q.num}</span>
              <span>${q.title}</span>
            </div>
            <ul class="bullet-list" ${editAttr}>
              ${q.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      } else if (s.layout === 'two_imgs') {
        bodyHtml = `
          <div style="display:flex; flex-direction:column; gap:8px; grid-column: 1 / -1; height:100%;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; flex:1; min-height:0;">
              <div class="img-box"><img src="${s.left_img}" alt="Graphic 1" /></div>
              <div class="img-box"><img src="${s.right_img}" alt="Graphic 2" /></div>
            </div>
            <div class="bottom-note" ${editAttr}>${s.bottom_note}</div>
          </div>
        `;
      } else if (s.layout === 'video') {
        bodyHtml = `
          <div class="video-box">
            <video id="storyVideo" controls autoplay playsinline poster="${s.poster_src}">
              <source src="${s.video_src}" type="video/mp4" />
            </video>
          </div>
          <div class="card red">
            <div class="card-header" ${editAttr}>
              <span class="pill-circle">▶</span>
              <span>${s.right_header}</span>
            </div>
            <ul class="bullet-list" ${editAttr}>
              ${s.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      } else if (s.layout === 'table') {
        bodyHtml = `
          <div style="display:flex; flex-direction:column; justify-content:space-between; height:100%;">
            <table class="ppt-table" ${editAttr}>
              <thead>
                <tr>${s.headers.map(h => `<th>${h}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${s.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
            <div class="bottom-note" ${editAttr}>${s.bottom_note}</div>
          </div>
        `;
      }

      canvas.innerHTML = `
        <div class="slide-top">
          <h1 class="slide-h1" ${editAttr}>${s.title}</h1>
          <div class="slide-sub" ${editAttr}>${s.subtitle}</div>
        </div>

        <div class="slide-body layout-${s.layout}">
          ${bodyHtml}
        </div>
      `;
      renderThumbnails();

      // Auto-play video with Vietnamese Google Voiceover when entering Slide 4!
      if (s.layout === 'video') {
        const vid = document.getElementById('storyVideo');
        if (vid) {
          vid.currentTime = 0;
          vid.muted = false;
          vid.play().catch(() => {
            vid.muted = true;
            vid.play();
          });
        }
      }
    }

    function goToSlide(idx) {
      currentIndex = idx;
      renderSlide();
    }
    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      renderSlide();
    }
    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      renderSlide();
    }
    function toggleEditMode() {
      isEditable = !isEditable;
      const btn = document.getElementById('editBtn');
      btn.classList.toggle('active', isEditable);
      btn.textContent = isEditable ? '✅ Đang Bật Chỉnh Sửa (Nhấp vào chữ để sửa)' : '✏️ Bật Chỉnh Sửa Chữ';
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (isEditable) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });

    renderSlide();
  </script>
</body>
</html>
